<section class="wrapper py-70" data-kind="page">
  <article class="content single-default">
    <form data-no-csrf id="search-form" class="p-20 bg--blue-lightest flex">
      <input type="search" name="q" id="search-filter" placeholder="Search ..." class="fx-g-1" autocomplete="off" />
      <button type="submit" id="search-trigger" class="ml-10 search-button" >Search</button>
    </form>
    <p id="search-status" aria-live="polite"></p>
    <main id="search-results"></main>
    <button type="button" id="search-more" class="search-button" hidden>Load more results</button>
    <script type="module">
      const pageSize = 10;
      const form = document.getElementById("search-form");
      const filter = document.getElementById("search-filter");
      const status = document.getElementById("search-status");
      const results = document.getElementById("search-results");
      const more = document.getElementById("search-more");
      const template = document.getElementById("search-entry");

      let pagefind;
      let current = [];
      let shown = 0;
      let latest = 0;

      try {
        pagefind = await import("/pagefind/pagefind.js");
        await pagefind.init();
      } catch (e) {
        console.error("Failed to load the search index", e);
        status.textContent = ["localhost", "127.0.0.1"].includes(location.hostname)
          ? "The search index is not available, it is generated when the site is built (npm run build:pagefind)."
          : "Search is currently unavailable, please try again later.";
      }

      async function showMore() {
        const searchId = latest;
        
        more.disabled = true;
        const batch = current.slice(shown, shown + pageSize);
        let docs;
        try {
          docs = await Promise.all(batch.map((r) => r.data()));
        } catch (e) {
          console.error("Failed to load search results", e);
          if (searchId === latest) {
            status.textContent = "Failed to load the results, please try again.";
          }
          return;
        } finally {
          more.disabled = false;
        }
        if (searchId !== latest) {
          return;
        }
        shown += batch.length;
        docs.forEach((doc) => {
          const clone = document.importNode(template.content, true);
          clone.querySelector("[data-title]").textContent = doc.meta.title || doc.url;
          clone.querySelector("[data-url]").setAttribute("href", doc.url);
          
          clone.querySelector("[data-summary]").innerHTML = doc.excerpt;
          results.appendChild(clone);
        });
        more.hidden = shown >= current.length;
      }

      async function searchFor(value) {
        if (!pagefind) {
          return;
        }
        const searchId = ++latest;
        const query = value.trim();
        const params = new URLSearchParams();
        if (query) {
          params.set("q", query);
        }
        const qs = params.toString();
        history.replaceState(null, "", qs ? "?" + qs : location.pathname);

        const search = query ? await pagefind.debouncedSearch(query, {}, 300) : null;
        if (searchId !== latest) {
          
          return;
        }
        results.innerHTML = "";
        current = search ? search.results : [];
        shown = 0;
        if (!query) {
          status.textContent = "";
          more.hidden = true;
          return;
        }
        status.textContent = current.length === 1 ? "1 result" : current.length + " results";
        await showMore();
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        searchFor(filter.value);
      });
      filter.addEventListener("input", () => searchFor(filter.value));
      more.addEventListener("click", showMore);

      const query = new URLSearchParams(window.location.search).get("q");
      if (query) {
        filter.value = query;
        searchFor(query);
      }
    </script>
    <template id="search-entry">
      <article class="pt-40 pb-40 bdr-btm">
        <a data-url href="#">
          <h2 data-title>Example</h2>
        </a>
      <div data-summary></div>
      </article>
    </template>
